<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LN-STUDY</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://apis.google.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com;
    frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash" class="splash" role="status" aria-label="Loading">
    <div class="splash-cards" aria-hidden="true">
      <i class="c-yellow"></i><i class="c-green"></i><i class="c-purple"></i><i class="c-pink"></i>
    </div>
    <div class="splash-logo">📚</div>
    <div class="splash-name">LN<span>-</span>STUDY</div>
    <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="topProgress" class="top-progress" aria-hidden="true"></div>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar" hidden>
      <a href="#/courses" class="brand" data-i18n-title="common.brand">📚</a>
      <nav class="rail">
        <a href="#/courses" data-nav="courses" data-i18n-title="nav.courses">
          <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 21.5h13"/></svg>
        </a>
        <a href="#/notes" data-nav="notes" data-i18n-title="nav.notesTitle">
          <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h7M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </a>
        <a href="#/exam" data-nav="exam" data-i18n-title="nav.exam">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4"/></svg>
        </a>
        <a href="#/saved" data-nav="saved" data-i18n-title="nav.saved">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
        </a>
        <a href="#/stats" data-nav="stats" data-i18n-title="nav.stats">
          <svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg>
        </a>
        <a href="#/upload" data-nav="upload" data-i18n-title="nav.upload">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </a>
        <a href="#/manage" data-nav="manage" data-i18n-title="nav.manage">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/></svg>
        </a>
        <a href="#/admin" data-nav="admin" class="admin-only" hidden data-i18n-title="nav.admin">
          <svg viewBox="0 0 24 24"><path d="M16 19a4 4 0 0 0-8 0M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm6-1a2.5 2.5 0 1 0 0-5M21 19a3.5 3.5 0 0 0-3-3.5M6 11a2.5 2.5 0 1 1 0-5M3 19a3.5 3.5 0 0 1 3-3.5"/></svg>
        </a>
      </nav>
      <nav class="rail rail-bottom">
        <a href="#/profile" data-nav="profile" class="rail-avatar" data-i18n-title="nav.profile">
          <img id="userAvatar" class="js-avatar" alt="" referrerpolicy="no-referrer" />
        </a>
      </nav>
    </aside>

    <div class="main">
      <main id="view" class="view"><div class="loader"></div></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" hidden>
      <a href="#/courses" data-nav="courses"><svg class="bn-ico" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 21.5h13"/></svg><em data-i18n="nav.courses"></em></a>
      <a href="#/notes" data-nav="notes"><svg class="bn-ico" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h7M4 6h.01M4 12h.01M4 18h.01"/></svg><em data-i18n="nav.notes"></em></a>
      <a href="#/exam" data-nav="exam"><svg class="bn-ico" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4"/></svg><em data-i18n="nav.exam"></em></a>
      <a href="#/saved" data-nav="saved"><svg class="bn-ico" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><em data-i18n="nav.saved"></em></a>
      <a href="#/profile" data-nav="profile"><img class="js-avatar bn-avatar" alt="" referrerpolicy="no-referrer" /><em data-i18n="nav.profile"></em></a>
    </nav>
  </div>

  <script type="module" src="js/router.js"></script>
</body>
</html>
